[workspace]
members = ["crates/trusty-memory-core", "crates/trusty-memory-mcp", "."]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
usearch = "2.25"
fastembed = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"
lru = "0.12"
tiktoken-rs = "0.5"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
regex = "1"
dirs = "5"
kuzu = "0.9"
clap_complete = "4"
colored = "2"
walkdir = "2"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["util"] }
trusty-mcp-core = { git = "https://github.com/bobmatnyc/trusty-common", tag = "trusty-mcp-core-v0.1.0" }
trusty-embedder = { git = "https://github.com/bobmatnyc/trusty-common", tag = "trusty-embedder-v0.1.0" }
trusty-common = { git = "https://github.com/bobmatnyc/trusty-common", tag = "trusty-common-v0.3.2", features = ["axum-server"] }

# Local-development override: point the trusty-common workspace at the
# sibling checkout so unreleased changes (e.g. `server::with_standard_middleware`,
# `write_daemon_addr`) can be consumed without publishing/tagging. The git
# dependency declarations above remain authoritative for downstream releases —
# [patch] only takes effect when this workspace is built directly.
[patch."https://github.com/bobmatnyc/trusty-common"]
trusty-common = { path = "../trusty-common/crates/trusty-common" }
trusty-embedder = { path = "../trusty-common/crates/trusty-embedder" }
trusty-mcp-core = { path = "../trusty-common/crates/trusty-mcp-core" }

[package]
name = "trusty-memory"
version = "0.1.29"
edition = "2021"
description = "Machine-wide, blazingly fast AI memory service"
license-file = "LICENSE"
repository = "https://github.com/bobmatnyc/trusty-memory"
homepage = "https://github.com/bobmatnyc/trusty-memory"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/trusty-memory-{ target }.tar.xz"
bin-dir = "trusty-memory-{ target }/trusty-memory{ binary-ext }"
pkg-fmt = "txz"

[[bin]]
name = "trusty-memory"
path = "src/main.rs"

[dependencies]
trusty-memory-core = { path = "crates/trusty-memory-core" }
trusty-memory-mcp = { path = "crates/trusty-memory-mcp" }
trusty-common = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
clap_complete = { workspace = true }
colored = { workspace = true }
walkdir = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
tiktoken-rs = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
