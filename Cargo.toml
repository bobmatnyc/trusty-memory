[workspace]
members = ["crates/trusty-memory-core", "crates/trusty-memory-mcp", "."]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
usearch = "2.25"
fastembed = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"
lru = "0.12"
tiktoken-rs = "0.5"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"], default-features = false }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
regex = "1"
dirs = "5"
kuzu = "0.9"
clap_complete = "4"
colored = "2"
walkdir = "2"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[package]
name = "trusty-memory"
version = "0.1.4"
edition = "2021"
description = "Machine-wide AI memory service with Memory Palace architecture"
license = "MIT"
repository = "https://github.com/bobmatnyc/trusty-memory"

[[bin]]
name = "trusty-memory"
path = "src/main.rs"

[dependencies]
trusty-memory-core = { path = "crates/trusty-memory-core" }
trusty-memory-mcp = { path = "crates/trusty-memory-mcp" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
clap_complete = { workspace = true }
colored = { workspace = true }
walkdir = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
